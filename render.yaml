# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy from repo root: Customer-Service-Chatbot/

services:
  - type: web
    name: chatbot-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: salesdb
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"

  - type: web
    name: chatbot-frontend
    runtime: static
    rootDir: Frontend/my-chat-bot
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
